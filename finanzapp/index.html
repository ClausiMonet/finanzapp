<meta name="theme-color" content="#0f172a">

<div id="app">
  <!-- Sperrbildschirm -->
  <section id="lock" class="lock hidden">
    <div class="lock-card">
      <div class="lock-logo">€</div>
      <h1>Finanzapp</h1>
      <p id="lock-text" class="muted"></p>
      <form id="lock-form" autocomplete="off">
        <input id="lock-pw" type="password" placeholder="Passwort" autocomplete="current-password" required>
        <input id="lock-pw2" type="password" placeholder="Passwort wiederholen" class="hidden" autocomplete="new-password">
        <button class="btn primary block" type="submit" id="lock-btn">Entsperren</button>
      </form>
      <button id="lock-bio" class="btn block hidden" type="button" style="margin-top:4px">👆 Mit Fingerabdruck entsperren</button>
      <p id="lock-err" class="err"></p>
      <p class="tiny muted">🔒 Deine Daten sind mit AES-256 verschlüsselt und verlassen dieses Gerät nie.</p>
      <button id="lock-restore" class="btn link tiny hidden" type="button">Backup-Datei wiederherstellen</button>
    </div>
  </section>

  <!-- Hauptansicht -->

      <a href="#vertraege" data-view="vertraege"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></i><span>Verträge</span></a>
